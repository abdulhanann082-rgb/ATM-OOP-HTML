{% extends "base.html" %}
{% block title %}Balance | PyBank ATM{% endblock %}
{% block content %}
    <h1 class="page-title">Check Balance</h1>
    <p class="page-subtitle">A/C No: {{ account.account_number }} ({{ account.account_type }})</p>

    <div class="result-box">
        <span class="result-label">Available Balance</span>
        <span class="result-amount">Rs. {{ "%.2f"|format(balance) }}</span>
    </div>

    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
{% endblock %}
