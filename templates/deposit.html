{% extends "base.html" %}
{% block title %}Deposit | PyBank ATM{% endblock %}
{% block content %}
    <h1 class="page-title">Deposit Cash</h1>
    <p class="page-subtitle">A/C No: {{ account.account_number }} &middot; Balance: Rs. {{ "%.2f"|format(account.balance) }}</p>

    <form method="POST" action="{{ url_for('deposit') }}" class="atm-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="amount">Amount (Rs.)</label>
        <input type="number" id="amount" name="amount" min="1" step="1" required autofocus>
        <button type="submit" class="btn btn-primary">Deposit</button>
    </form>

    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
{% endblock %}
