{% extends "base.html" %}
{% block title %}Change PIN | PyBank ATM{% endblock %}
{% block content %}
    <h1 class="page-title">Change PIN</h1>
    <p class="page-subtitle">A/C No: {{ account.account_number }}</p>

    <form method="POST" action="{{ url_for('change_pin') }}" class="atm-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current_pin">Current PIN</label>
        <input type="password" id="current_pin" name="current_pin" maxlength="4" inputmode="numeric" required autofocus>

        <label for="new_pin">New PIN</label>
        <input type="password" id="new_pin" name="new_pin" maxlength="4" inputmode="numeric" required>

        <label for="confirm_pin">Confirm New PIN</label>
        <input type="password" id="confirm_pin" name="confirm_pin" maxlength="4" inputmode="numeric" required>

        <p class="hint-text">PIN must be exactly 4 digits.</p>
        <button type="submit" class="btn btn-primary">Change PIN</button>
    </form>

    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
{% endblock %}
